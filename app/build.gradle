plugins {
    id 'com.android.application'
}

android {
    namespace 'hu.kaminari.dojo'
    compileSdk 35

    defaultConfig {
        applicationId 'hu.kaminari.dojo'
        minSdk 24
        targetSdk 28
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
