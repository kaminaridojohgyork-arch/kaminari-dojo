<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaminari 2.0 – Teszt</title><style>:root{font-family:system-ui;color:#eef6ff;background:#071525}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:720px;margin:auto}h1{font-size:26px}section{background:#102842;border:1px solid #31597d;border-radius:16px;padding:18px;margin:15px 0}label{display:block;margin:12px 0 5px}input,textarea,select{width:100%;background:#071c31;color:white;border:1px solid #5c82a3;border-radius:9px;padding:12px;font:inherit}textarea{min-height:135px}button{border:0;border-radius:10px;background:#e9bc4b;color:#102039;padding:12px 17px;font-weight:700;cursor:pointer;margin:8px 8px 4px 0}button:disabled{opacity:.5}a{color:#9cddff}.hidden{display:none}small{color:#bbcee0}#status{min-height:22px;white-space:pre-wrap}</style></head><body><main><h1>Látogatottság – TESZT</h1><p>A teszt egy külön anonim azonosítót használ, de a közös számlálóba ír.</p><section><button id="visit">Tesztlátogatás rögzítése</button><button id="admin">Admin statisztika</button></section><section id="login" hidden><label>E-mail<input id="email" type="email"></label><label>Jelszó<input id="password" type="password"></label><button id="loginBtn">Belépés</button></section><section id="stats" hidden><p>Mai látogatások: <strong id="today">–</strong></p><p>Heti látogatások: <strong id="week">–</strong></p><p>Havi látogatások: <strong id="month">–</strong></p><p>Összes látogatás: <strong id="total">–</strong></p><button id="logout">Kijelentkezés</button></section><p id="status" role="status"></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInAnonymously,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getDatabase,ref,set,onValue} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
const config={apiKey:'AIzaSyBIW12puH6ctU9619GZtWTtHfnoTo6POPk',authDomain:'kaminari-dojo.firebaseapp.com',databaseURL:'https://kaminari-dojo-default-rtdb.europe-west1.firebasedatabase.app',projectId:'kaminari-dojo',appId:'1:293927833714:web:2af8ecd007cdc4de1db2eb'},ADMIN='RE9QjkQYIVgEOqZ5gpVQbINffDv2',p=initializeApp(config,'visit-parent-test'),a=initializeApp(config,'visit-admin-test'),pa=getAuth(p),aa=getAuth(a),pd=getDatabase(p),ad=getDatabase(a),$=x=>document.getElementById(x);
const day=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Budapest',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
let data={},unsub=null,ready=false,adminMode=false;const status=t=>$('status').textContent=t;
function render(){if(!ready)return;const d=day(),m=d.slice(0,7),w=new Date(d+'T00:00:00Z');w.setUTCDate(w.getUTCDate()-((w.getUTCDay()+6)%7));const start=w.toISOString().slice(0,10);let today=0,week=0,month=0,total=0;for(const [k,v] of Object.entries(data)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||k>d)continue;const n=Object.values(v||{}).filter(x=>x===true).length;total+=n;if(k===d)today+=n;if(k>=start)week+=n;if(k.startsWith(m))month+=n}for(const [k,v] of Object.entries({today,week,month,total}))$(k).textContent=v.toLocaleString('hu-HU')}
$('visit').onclick=async()=>{ $('visit').disabled=true;try{await pa.authStateReady();if(!pa.currentUser?.isAnonymous)await signInAnonymously(pa);const d=day(),key='kaminari-visit-test:'+pa.currentUser.uid+':'+d;if(localStorage.getItem(key)){status('Ma már rögzítve.');return}await set(ref(pd,'visits/'+d+'/'+pa.currentUser.uid),true);localStorage.setItem(key,'1');status('Látogatás rögzítve.')}catch(e){status('Nem történt új rögzítés: '+(e.code||e.message))}finally{$('visit').disabled=false}};
function adminUI(u){if(unsub)unsub();unsub=null;ready=false;data={};const ok=adminMode&&u?.uid===ADMIN;$('login').hidden=!adminMode||ok;$('stats').hidden=!ok;for(const k of ['today','week','month','total'])$(k).textContent='–';if(ok)unsub=onValue(ref(ad,'visits'),s=>{data=s.val()||{};ready=true;render()},e=>status(e.code))}
$('admin').onclick=()=>{adminMode=true;adminUI(aa.currentUser)};onAuthStateChanged(aa,adminUI);
$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(aa,$('email').value,$('password').value);$('password').value=''}catch(e){status(e.code)}};
$('logout').onclick=()=>signOut(aa);setInterval(render,15000);
</script></body></html>
