name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Android project structure
        run: |
          mkdir -p app/src/main/java/hu/kaminari/dojo
          mkdir -p app/src/main/assets

          cp MainActivity.java app/src/main/java/hu/kaminari/dojo/
          cp AndroidManifest.xml app/src/main/
          cp index.html app/src/main/assets/

          if [ -f logo.png ]; then
            cp logo.png app/src/main/assets/
          fi

          if [ -f kaminari-hatter.jpg ]; then
            cp kaminari-hatter.jpg app/src/main/assets/
          fi

          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap

          if [ -f ic_launcher.png ]; then
            cp ic_launcher.png app/src/main/res/mipmap/
          fi

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaminari-Dojo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest public APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Kaminari Dojo – legfrissebb Android alkalmazás" --notes "A Kaminari Dojo aktuális Android tesztverziója. A hírek és az események online frissülnek." --latest
          gh release upload android-latest app/build/outputs/apk/debug/app-debug.apk#Kaminari-Dojo.apk --clobber
