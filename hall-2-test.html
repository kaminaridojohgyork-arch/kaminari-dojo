<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaminari 2.0 – Teszt</title><style>:root{font-family:system-ui;color:#eef6ff;background:#071525}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:720px;margin:auto}h1{font-size:26px}section{background:#102842;border:1px solid #31597d;border-radius:16px;padding:18px;margin:15px 0}label{display:block;margin:12px 0 5px}input,textarea,select{width:100%;background:#071c31;color:white;border:1px solid #5c82a3;border-radius:9px;padding:12px;font:inherit}textarea{min-height:135px}button{border:0;border-radius:10px;background:#e9bc4b;color:#102039;padding:12px 17px;font-weight:700;cursor:pointer;margin:8px 8px 4px 0}button:disabled{opacity:.5}a{color:#9cddff}.hidden{display:none}small{color:#bbcee0}#status{min-height:22px;white-space:pre-wrap}</style></head><body><main><h1>🏆 Dicsőségfal – TESZT</h1><p>Csak fiktív nevek. A tesztadatok privátak.</p><section id="login"><label>E-mail</label><input id="email" type="email"><label>Jelszó</label><input id="password" type="password"><button id="loginBtn">Belépés</button></section><section id="editor" class="hidden"><button id="logout">Kijelentkezés</button><label>Szezon</label><select id="season"></select><label>Versenyző neve</label><input id="name" maxlength="120"><button id="add">Hozzáadás</button><div id="rows"></div></section><p id="status" role="status"></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getDatabase,ref,get,set,push,onValue} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
const ADMIN='RE9QjkQYIVgEOqZ5gpVQbINffDv2';
const app=initializeApp({apiKey:'AIzaSyBIW12puH6ctU9619GZtWTtHfnoTo6POPk',authDomain:'kaminari-dojo.firebaseapp.com',databaseURL:'https://kaminari-dojo-default-rtdb.europe-west1.firebasedatabase.app',projectId:'kaminari-dojo',appId:'1:293927833714:web:2af8ecd007cdc4de1db2eb'});


const auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id),year=()=>Number(new Intl.DateTimeFormat('en',{timeZone:'Europe/Budapest',year:'numeric'}).format(new Date()));
let data={},ready=false,busy=false,unsub=null,lastYear=year();
const status=t=>$('status').textContent=t;
function seasons(){const old=$('season').value;$('season').replaceChildren();const years=[...new Set([year(),...Object.keys(data).map(Number).filter(Number.isInteger)])].sort((a,b)=>b-a);for(const y of years)$('season').add(new Option(y,y));$('season').value=years.includes(Number(old))?old:String(year())}
function render(){const y=$('season').value,edit=ready&&!busy&&Number(y)===year()&&auth.currentUser?.uid===ADMIN;$('add').disabled=!edit;const root=$('rows');root.replaceChildren();const table=document.createElement('table');table.style.cssText='width:100%;border-collapse:collapse;text-align:center';const header=table.insertRow();for(const s of ['Versenyző','🥇','🥈','🥉','Össz.']){const th=document.createElement('th');th.textContent=s;header.append(th)}
const entries=Object.entries(data[y]||{}).sort((a,b)=>{for(const k of ['gold','silver','bronze']){const d=(b[1][k]||0)-(a[1][k]||0);if(d)return d}return a[1].name.localeCompare(b[1].name,'hu')});
for(const [id,m] of entries){const row=table.insertRow();row.insertCell().textContent=m.name;let sum=0;for(const k of ['gold','silver','bronze']){const c=row.insertCell(),n=m[k]||0;sum+=n;if(edit){const input=document.createElement('input');input.type='number';input.min=0;input.max=9999;input.step=1;input.value=n;input.style.cssText='width:64px;padding:6px';input.setAttribute('aria-label',m.name+' '+k);input.onchange=()=>{const v=Number(input.value);if(!Number.isInteger(v)||v<0||v>9999){render();return}write(()=>set(ref(db,'private/hallTest/'+y+'/'+id+'/'+k),v))};c.append(input)}else c.textContent=n}row.insertCell().textContent=sum;if(edit){const c=row.insertCell(),b=document.createElement('button');b.textContent='Törlés';b.onclick=()=>{if(confirm('Törlöd a versenyzőt ebből a szezonból?'))write(()=>set(ref(db,'private/hallTest/'+y+'/'+id),null))};c.append(b)}}root.append(table)}
async function write(fn){if(!ready||busy||auth.currentUser?.uid!==ADMIN||Number($('season').value)!==year())return;busy=true;render();try{await fn();status('Mentve.')}catch(e){status('Hiba: '+(e.code||e.message))}finally{busy=false;render()}}
$('season').onchange=render;$('add').onclick=()=>{const name=$('name').value.trim();if(!name)return;write(async()=>{await set(push(ref(db,'private/hallTest/'+year())),{name,gold:0,silver:0,bronze:0});$('name').value=''})};
$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('password').value=''}catch(e){status(e.code)}};$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(unsub)unsub();unsub=null;data={};ready=false;const ok=u?.uid===ADMIN;$('editor').classList.toggle('hidden',!ok);$('login').classList.toggle('hidden',ok);seasons();render();if(!ok){if(u)signOut(auth);return}unsub=onValue(ref(db,'private/hallTest'),s=>{data=s.val()||{};ready=true;seasons();render()},e=>{ready=false;render();status(e.code)})});
setInterval(()=>{if(year()!==lastYear){lastYear=year();seasons();$('season').value=String(lastYear);render()}},15000);
</script></body></html>
