<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Versenyjelentkezés – Teszt</title><style>:root{font-family:system-ui;color:#eef6ff;background:#071525}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:720px;margin:auto}h1{font-size:26px}section{background:#102842;border:1px solid #31597d;border-radius:16px;padding:18px;margin:15px 0}label{display:block;margin:12px 0 5px}input,textarea,select{width:100%;background:#071c31;color:white;border:1px solid #5c82a3;border-radius:9px;padding:12px;font:inherit}textarea{min-height:135px}button{border:0;border-radius:10px;background:#e9bc4b;color:#102039;padding:12px 17px;font-weight:700;cursor:pointer;margin:8px 8px 4px 0}button:disabled{opacity:.5}a{color:#9cddff}.hidden{display:none}small{color:#bbcee0}#status{min-height:22px;white-space:pre-wrap}</style></head><body><main><h1>🥋 Versenyjelentkezés – TESZT</h1><p>Kizárólag fiktív nevek! Egy anonim azonosítóhoz egy válasz tartozik.</p><section><button id="parent">Szülői teszt</button><button id="admin">Admin teszt</button></section><section id="login" hidden><label>E-mail<input id="email" type="email"></label><label>Jelszó<input id="password" type="password"></label><button id="loginBtn">Belépés</button></section><section id="manage" hidden><label>Határidő (perc múlva)<input id="minutes" type="number" min="1" max="1440" value="10"></label><button id="open">Tesztverseny megnyitása</button><button id="close">Lezárás</button><div id="results"></div></section><section id="form" hidden><p id="event"></p><label>Fiktív név<input id="name" maxlength="100"></label><label>Dojo<select id="dojo"><option>Hévízgyörk</option><option>Tura</option></select></label><label>Részvétel<select id="attending"><option value="yes">Jövök</option><option value="no">Nem jövök</option></select></label><button id="send">Válasz elküldése</button></section><p id="status" role="status"></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInAnonymously,signInWithEmailAndPassword,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getDatabase,ref,set,onValue} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
const config={apiKey:'AIzaSyBIW12puH6ctU9619GZtWTtHfnoTo6POPk',authDomain:'kaminari-dojo.firebaseapp.com',databaseURL:'https://kaminari-dojo-default-rtdb.europe-west1.firebasedatabase.app',projectId:'kaminari-dojo',appId:'1:293927833714:web:2af8ecd007cdc4de1db2eb'},ADMIN='RE9QjkQYIVgEOqZ5gpVQbINffDv2',p=initializeApp(config,'competition-parent-test'),a=initializeApp(config,'competition-admin-test'),pa=getAuth(p),aa=getAuth(a),pd=getDatabase(p),ad=getDatabase(a),id='kaminari-test-2',ep='public/competitions/'+id,sp='competitionSignups/'+id,$=x=>document.getElementById(x);
let event=null,mode='',unsub=null;const status=t=>$('status').textContent=t;
function render(){const active=event?.open===true&&event.deadline>Date.now();$('event').textContent=active?'Tesztverseny nyitva – '+new Date(event.deadline).toLocaleString('hu-HU'):'Jelentkezés lezárva';$('send').disabled=!active||!pa.currentUser?.isAnonymous;}
onValue(ref(pd,ep),s=>{event=s.val();render()},e=>status(e.code));setInterval(render,1000);
$('parent').onclick=async()=>{mode='parent';$('login').hidden=true;$('manage').hidden=true;$('form').hidden=false;try{if(!pa.currentUser?.isAnonymous)await signInAnonymously(pa);render();status('Szülői teszt kész.')}catch(e){status(e.code)}};
$('admin').onclick=()=>{mode='admin';$('form').hidden=true;adminUI(aa.currentUser)};
function adminUI(u){if(mode!=='admin')return;const ok=u?.uid===ADMIN;$('login').hidden=ok;$('manage').hidden=!ok;if(unsub)unsub();unsub=null;if(ok)unsub=onValue(ref(ad,sp),s=>{const rows=Object.values(s.val()||{}),root=$('results');root.replaceChildren();const h=document.createElement('p');h.textContent='Jön: '+rows.filter(x=>x.attending).length+' | Nem jön: '+rows.filter(x=>!x.attending).length;root.append(h);for(const x of rows){const line=document.createElement('p');line.textContent=x.name+' – '+x.dojo+' – '+(x.attending?'Jön':'Nem jön');root.append(line)}},e=>status(e.code))}
onAuthStateChanged(aa,adminUI);onAuthStateChanged(pa,render);
$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(aa,$('email').value,$('password').value);$('password').value='';adminUI(aa.currentUser)}catch(e){status(e.code)}};
$('open').onclick=async()=>{try{const n=Number($('minutes').value);if(!Number.isInteger(n)||n<1||n>1440)throw Error('Érvénytelen határidő');await set(ref(ad,ep),{title:'TESZT – nem valódi verseny',open:true,deadline:Date.now()+n*60000});status('Tesztverseny megnyitva.')}catch(e){status(e.code||e.message)}};
$('close').onclick=async()=>{try{await set(ref(ad,ep+'/open'),false);status('Lezárva.')}catch(e){status(e.code)}};
$('send').onclick=async()=>{const name=$('name').value.trim();if(!name)return status('Adj meg fiktív nevet.');try{await set(ref(pd,sp+'/'+pa.currentUser.uid),{name,dojo:$('dojo').value,attending:$('attending').value==='yes'});status('Válasz mentve.')}catch(e){status('Hiba: '+e.code)}};
</script></body></html>
